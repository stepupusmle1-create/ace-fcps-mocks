<svg viewBox="0 0 560 380" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, sans-serif">
  <rect width="560" height="380" fill="#ffffff"/>
  <text x="280" y="28" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a">Left Ventricular Pressure-Volume Loop (Original Schematic)</text>

  <line x1="80" y1="300" x2="500" y2="300" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="80" y1="60" x2="80" y2="300" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="290" y="330" text-anchor="middle" font-size="12" fill="#64748b">Ventricular volume</text>
  <text x="40" y="180" font-size="12" fill="#64748b" transform="rotate(-90 40 180)">Pressure</text>

  <!-- Loop traced counterclockwise: A (mitral opens, ESV, low P) -> filling -> B (mitral closes, EDV, low P)
       -> isovolumetric contraction (up) -> C (aortic opens) -> ejection (left, arching) -> D (aortic closes, ESV)
       -> isovolumetric relaxation (down) -> back to A -->
  <path d="M 200 270
           C 260 262 320 258 360 250
           L 360 130
           C 340 95 280 80 240 78
           C 210 77 200 95 200 130
           L 200 270 Z"
        fill="#eef2ff" stroke="#4f46e5" stroke-width="3"/>

  <!-- A: mitral valve opens (ESV, lowest pressure) -->
  <circle cx="200" cy="270" r="4" fill="#4f46e5"/>
  <text x="150" y="290" font-size="11" fill="#312e81" text-anchor="middle">A: Mitral opens</text>
  <text x="150" y="303" font-size="10" fill="#64748b" text-anchor="middle">(ESV)</text>

  <!-- B: mitral valve closes (EDV, low pressure) -->
  <circle cx="360" cy="250" r="4" fill="#4f46e5"/>
  <text x="410" y="248" font-size="11" fill="#312e81">B: Mitral closes</text>
  <text x="410" y="261" font-size="10" fill="#64748b">(EDV)</text>

  <!-- C: aortic valve opens (EDV, pressure = aortic diastolic) -->
  <circle cx="360" cy="130" r="4" fill="#4f46e5"/>
  <text x="410" y="128" font-size="11" fill="#312e81">C: Aortic opens</text>

  <!-- D: aortic valve closes (ESV, end-systolic pressure) -->
  <circle cx="240" cy="78" r="4" fill="#4f46e5"/>
  <text x="240" y="62" font-size="11" fill="#312e81" text-anchor="middle">D: Aortic closes</text>

  <!-- segment labels -->
  <text x="180" y="200" font-size="11" fill="#4338ca" text-anchor="middle" transform="rotate(-90 180 200)">Isovolumetric relaxation</text>
  <text x="280" y="288" font-size="11" fill="#4338ca" text-anchor="middle">Filling (A&#8594;B)</text>
  <text x="378" y="190" font-size="11" fill="#4338ca" text-anchor="middle" transform="rotate(-90 378 190)">Isovolumetric contraction</text>
  <text x="290" y="95" font-size="11" fill="#4338ca" text-anchor="middle">Ejection (C&#8594;D)</text>

  <text x="280" y="358" text-anchor="middle" font-size="11" fill="#94a3b8">Loop is traced counterclockwise &#183; width = stroke volume &#183; enclosed area = external stroke work</text>
</svg>
