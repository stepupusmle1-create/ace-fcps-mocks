<svg viewBox="0 0 560 400" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, sans-serif">
  <rect width="560" height="400" fill="#ffffff"/>
  <text x="280" y="28" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a">Coronary Arteries — Anterior View (Original Schematic)</text>

  <!-- heart outline -->
  <path d="M 200 70 Q 150 40 110 90 Q 70 140 110 210 Q 150 280 280 350 Q 410 280 450 210 Q 490 140 450 90 Q 410 40 360 70 Q 320 40 280 90 Q 240 40 200 70 Z"
        fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>

  <!-- RCA (right coronary artery) - runs in right AV groove -->
  <path d="M 380 95 Q 430 110 440 170 Q 445 230 400 290 Q 370 320 330 335"
        fill="none" stroke="#dc2626" stroke-width="4" stroke-linecap="round"/>
  <text x="460" y="175" font-size="12" font-weight="700" fill="#991b1b">RCA</text>

  <!-- LAD -->
  <path d="M 260 90 Q 270 180 280 260 Q 285 300 290 340"
        fill="none" stroke="#2563eb" stroke-width="4" stroke-linecap="round"/>
  <text x="255" y="230" font-size="12" font-weight="700" fill="#1d4ed8" text-anchor="end">LAD</text>

  <!-- LCx -->
  <path d="M 260 90 Q 200 120 180 180 Q 165 230 190 280"
        fill="none" stroke="#059669" stroke-width="4" stroke-linecap="round"/>
  <text x="130" y="220" font-size="12" font-weight="700" fill="#047857">LCx</text>

  <!-- left main -->
  <circle cx="260" cy="90" r="5" fill="#0f172a"/>
  <text x="260" y="75" font-size="11" fill="#0f172a" text-anchor="middle">Left main</text>

  <!-- SA/AV node markers -->
  <circle cx="400" cy="120" r="4" fill="#4f46e5"/>
  <text x="410" y="115" font-size="10" fill="#4338ca">SA node region</text>
  <circle cx="330" cy="270" r="4" fill="#4f46e5"/>
  <text x="335" y="290" font-size="10" fill="#4338ca">AV node region</text>

  <text x="280" y="378" text-anchor="middle" font-size="11" fill="#94a3b8">RCA supplies SA/AV nodes in ~90% (right-dominant) · LAD supplies anteroseptal wall · LCx supplies lateral wall</text>
</svg>
