<svg viewBox="0 0 640 380" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, sans-serif">
  <rect width="640" height="380" fill="#ffffff"/>
  <text x="320" y="26" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a">Cardiac Cycle Overview (Original Schematic)</text>

  <!-- pressure axis -->
  <line x1="70" y1="230" x2="600" y2="230" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="70" y1="60" x2="70" y2="230" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="30" y="150" font-size="12" fill="#64748b" transform="rotate(-90 30 150)">Pressure (mmHg)</text>

  <!-- aortic pressure (top curve) -->
  <path d="M 70 150 L 150 150 C 180 90 220 85 260 90 C 320 100 360 140 400 150 L 600 150"
        fill="none" stroke="#ef4444" stroke-width="2.5"/>
  <text x="600" y="145" font-size="11" fill="#ef4444" text-anchor="end">Aortic pressure</text>

  <!-- LV pressure (middle curve) -->
  <path d="M 70 220 L 140 220 C 160 220 165 90 260 90 C 300 90 320 130 340 150 L 380 220 L 600 220"
        fill="none" stroke="#4f46e5" stroke-width="2.5"/>
  <text x="600" y="212" font-size="11" fill="#4f46e5" text-anchor="end">LV pressure</text>

  <!-- LA pressure (bottom, near-flat) -->
  <path d="M 70 225 C 100 220 120 225 150 225 L 340 225 C 360 210 380 225 400 225 L 600 226"
        fill="none" stroke="#10b981" stroke-width="2"/>
  <text x="600" y="238" font-size="11" fill="#10b981" text-anchor="end">LA pressure</text>

  <!-- dicrotic notch marker -->
  <circle cx="400" cy="150" r="3" fill="#ef4444"/>
  <text x="400" y="135" font-size="10" text-anchor="middle" fill="#991b1b">dicrotic notch</text>

  <!-- heart sounds -->
  <text x="140" y="255" font-size="13" font-weight="700" fill="#0f172a">S1</text>
  <text x="380" y="255" font-size="13" font-weight="700" fill="#0f172a">S2</text>
  <line x1="140" y1="230" x2="140" y2="248" stroke="#0f172a" stroke-width="1.5"/>
  <line x1="380" y1="230" x2="380" y2="248" stroke="#0f172a" stroke-width="1.5"/>

  <!-- phase bands -->
  <rect x="140" y="270" width="20" height="14" fill="#e2e8f0"/>
  <text x="150" y="300" font-size="10" text-anchor="middle" fill="#64748b">Isovolumetric contraction</text>
  <rect x="160" y="270" width="220" height="14" fill="#eef2ff"/>
  <text x="270" y="316" font-size="10" text-anchor="middle" fill="#64748b">Ventricular ejection</text>
  <rect x="380" y="270" width="30" height="14" fill="#e2e8f0"/>
  <text x="395" y="300" font-size="10" text-anchor="middle" fill="#64748b">Isovolumetric relaxation</text>
  <rect x="410" y="270" width="190" height="14" fill="#ecfdf5"/>
  <text x="500" y="316" font-size="10" text-anchor="middle" fill="#64748b">Ventricular filling</text>

  <text x="320" y="348" text-anchor="middle" font-size="11" fill="#94a3b8">S1 = mitral/tricuspid closure (start of systole) · S2 = aortic/pulmonic closure (start of diastole)</text>
</svg>
