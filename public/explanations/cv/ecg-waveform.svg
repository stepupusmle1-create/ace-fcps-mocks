<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, sans-serif">
  <rect width="640" height="300" fill="#ffffff"/>
  <text x="320" y="28" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a">Normal ECG Complex (Original Schematic)</text>

  <!-- baseline -->
  <line x1="40" y1="170" x2="600" y2="170" stroke="#cbd5e1" stroke-width="1"/>

  <!-- ECG trace: P wave, PR segment, QRS, ST segment, T wave -->
  <path d="M 60 170
           Q 85 170 95 145
           Q 105 170 130 170
           L 148 170
           L 155 178 L 165 200 L 180 90 L 195 210 L 205 170
           L 260 170
           Q 300 130 340 170
           L 560 170"
        fill="none" stroke="#4f46e5" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- Labels -->
  <text x="95" y="130" text-anchor="middle" font-size="14" font-weight="600" fill="#1e293b">P</text>
  <text x="180" y="80" text-anchor="middle" font-size="14" font-weight="600" fill="#1e293b">R</text>
  <text x="165" y="222" text-anchor="middle" font-size="13" fill="#475569">Q</text>
  <text x="195" y="230" text-anchor="middle" font-size="13" fill="#475569">S</text>
  <text x="300" y="120" text-anchor="middle" font-size="14" font-weight="600" fill="#1e293b">T</text>

  <!-- PR interval: start of P to start of QRS (onset of Q) -->
  <line x1="60" y1="245" x2="155" y2="245" stroke="#10b981" stroke-width="2"/>
  <line x1="60" y1="240" x2="60" y2="250" stroke="#10b981" stroke-width="2"/>
  <line x1="155" y1="240" x2="155" y2="250" stroke="#10b981" stroke-width="2"/>
  <text x="107" y="262" text-anchor="middle" font-size="12" fill="#10b981" font-weight="600">PR interval</text>

  <!-- QRS duration: onset of Q to end of S -->
  <line x1="155" y1="270" x2="205" y2="270" stroke="#f59e0b" stroke-width="2"/>
  <line x1="155" y1="265" x2="155" y2="275" stroke="#f59e0b" stroke-width="2"/>
  <line x1="205" y1="265" x2="205" y2="275" stroke="#f59e0b" stroke-width="2"/>
  <text x="180" y="290" text-anchor="middle" font-size="12" fill="#b45309" font-weight="600">QRS</text>

  <!-- QT interval: start of QRS to end of T wave -->
  <line x1="155" y1="20" x2="340" y2="20" stroke="#ef4444" stroke-width="2"/>
  <line x1="155" y1="15" x2="155" y2="25" stroke="#ef4444" stroke-width="2"/>
  <line x1="340" y1="15" x2="340" y2="25" stroke="#ef4444" stroke-width="2"/>
  <text x="247" y="46" text-anchor="middle" font-size="12" fill="#dc2626" font-weight="600">QT interval</text>

  <text x="320" y="290" text-anchor="middle" font-size="11" fill="#94a3b8">PR interval = start of P to start of QRS &#183; QT interval = start of QRS to end of T</text>
</svg>
