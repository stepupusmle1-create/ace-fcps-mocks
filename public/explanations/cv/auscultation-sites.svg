<svg viewBox="0 0 480 420" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, sans-serif">
  <rect width="480" height="420" fill="#ffffff"/>
  <text x="240" y="28" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a">Valve Auscultation Sites (Original Schematic)</text>

  <!-- simple chest outline -->
  <path d="M 240 60 Q 150 60 130 140 L 120 340 Q 120 370 150 370 L 330 370 Q 360 370 360 340 L 350 140 Q 330 60 240 60 Z"
        fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <line x1="240" y1="60" x2="240" y2="370" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="3 3"/>

  <!-- Aortic area: right 2nd ICS -->
  <circle cx="270" cy="110" r="10" fill="#ef4444"/>
  <text x="330" y="105" font-size="12" font-weight="600" fill="#991b1b">Aortic (R 2nd ICS)</text>

  <!-- Pulmonic area: left 2nd ICS -->
  <circle cx="210" cy="110" r="10" fill="#2563eb"/>
  <text x="90" y="105" font-size="12" font-weight="600" fill="#1d4ed8" text-anchor="end">Pulmonic (L 2nd ICS)</text>

  <!-- Tricuspid area: left lower sternal border -->
  <circle cx="225" cy="230" r="10" fill="#059669"/>
  <text x="90" y="235" font-size="12" font-weight="600" fill="#047857" text-anchor="end">Tricuspid (L lower sternal border)</text>

  <!-- Mitral area: apex, 5th ICS midclavicular -->
  <circle cx="260" cy="300" r="10" fill="#7c3aed"/>
  <text x="330" y="305" font-size="12" font-weight="600" fill="#6d28d9">Mitral (apex, 5th ICS MCL)</text>

  <text x="240" y="400" text-anchor="middle" font-size="11" fill="#94a3b8">Mnemonic: APTM, left to right &#8212; All Physicians Take Money</text>
</svg>
